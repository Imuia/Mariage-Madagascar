<body class="min-h-screen">
<div data-global-header></div>
<main class="pt-24 pb-20"><section class="max-w-5xl mx-auto px-6">
<a href="/blog-inspirations.html" class="inline-flex items-center gap-2 text-[#7dd3fc] text-sm mb-8"><span class="material-symbols-outlined">arrow_back</span>Retour aux inspirations</a>
<article id="blog-detail" class="glass-panel rounded-2xl overflow-hidden"><div class="p-12 text-center text-[#a0b4c4]">Chargement...</div></article>
</section></main>
<div data-global-footer></div>
<script src="/components/components.js"></script>
<script>
(function () {
  'use strict';

  const SUPABASE_URL = 'https://qrkinjuhtyfptldlvdyg.supabase.co';
  const root = document.getElementById('blog-detail');

  if (!root) return;

  const REAL_KEY = 'sb_publishable_MT2uo1JdbfVSZAjwXqW7gg_NITLziCF';

  function canonicalSlug(slug) {
    return String(slug || '').trim().replace(/-2$/, '');
  }

  function getSlug() {
    const querySlug = new URLSearchParams(location.search).get('slug');
    if (querySlug) return canonicalSlug(querySlug);

    const path = decodeURIComponent(location.pathname)
      .replace(/\/+$/, '')
      .replace(/^\/+/, '');

    if (!path || /\.html$/i.test(path)) return '';
    return canonicalSlug(path);
  }

  function esc(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  async function getJson(url) {
    const response = await fetch(url, {
      headers: {
        apikey: REAL_KEY,
        Authorization: 'Bearer ' + REAL_KEY
      }
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return response.json();
  }

  function localImageCandidates(slug, index) {
    const safe = encodeURIComponent(canonicalSlug(slug));
    const n = String(index).padStart(2, '0');
    return [
      '/assets/img/blog/' + safe + '/' + n + '.jpg',
      '/assets/img/blog/' + safe + '/' + n + '.jpeg',
      '/assets/img/blog/' + safe + '/' + n + '.png',
      '/assets/img/blog/' + safe + '/' + n + '.webp',
      '/assets/img/blog/' + safe + '/' + n + '.gif',
      '/assets/img/blog/' + safe + '/' + n + '.avif'
    ];
  }

  function rewriteSameSiteArticleLinks(html) {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = html || '';

    wrapper.querySelectorAll('a[href]').forEach(function (a) {
      try {
        const url = new URL(a.getAttribute('href'), location.origin);
        const host = url.hostname.toLowerCase();

        // Convert internal links from the old Mariage Madagascar website
        // to the new Vercel article route when they point to an article path.
        if (host === 'www.mariage-madagascar.com' || host === 'mariage-madagascar.com') {
          const path = url.pathname.replace(/^\/+|\/+$/g, '');
          if (path && !/^(en|fr)$/i.test(path) && !/\.(html?|php)$/i.test(path)) {
            const slug = canonicalSlug(path.split('/').filter(Boolean).pop());
            if (slug) {
              a.setAttribute('href', '/' + encodeURIComponent(slug));
              a.removeAttribute('target');
              a.removeAttribute('rel');
            }
          }
        }
      } catch (e) {}
    });

    return wrapper.innerHTML;
  }

  function replaceContentImages(html, gallery) {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = html || '';

    const validGallery = Array.isArray(gallery)
      ? gallery.filter(function (x) { return x && x.image_url; })
      : [];

    wrapper.querySelectorAll('img').forEach(function (img, index) {
      const row = validGallery[index];
      const fallback = localImageCandidates(getSlug(), index + 1)[0];

      if (row && row.image_url) {
        img.setAttribute('src', row.image_url);
      } else if (/mediumaquamarine-wombat-472759\.hostingersite\.com|mariage-madagascar\.com\/wp-content\/uploads/i.test(img.getAttribute('src') || '')) {
        img.setAttribute('src', fallback);
      }

      if (!img.getAttribute('alt')) {
        img.setAttribute('alt', '');
      }
    });

    return wrapper.innerHTML;
  }

  async function main() {
    const slug = getSlug();

    if (!slug) {
      root.innerHTML = '<div class="p-12 text-center">Article introuvable.</div>';
      return;
    }

    const posts = await getJson(
      SUPABASE_URL +
      '/rest/v1/blog_posts' +
      '?select=id,title,slug,summary,content,featured_image_url,seo_title,seo_description,published_at,is_published' +
      '&slug=eq.' + encodeURIComponent(slug) +
      '&is_published=eq.true' +
      '&limit=1'
    );

    const post = Array.isArray(posts) ? posts[0] : null;

    if (!post) {
      root.innerHTML = '<div class="p-12 text-center">Article introuvable.</div>';
      return;
    }

    const images = await getJson(
      SUPABASE_URL +
      '/rest/v1/blog_post_images' +
      '?select=image_url,alt_text,sort_order,is_featured' +
      '&blog_post_id=eq.' + encodeURIComponent(post.id) +
      '&order=sort_order.asc'
    );

    const gallery = Array.isArray(images) ? images : [];
    const featuredRow =
      gallery.find(function (x) { return x && x.is_featured && x.image_url; }) ||
      gallery.find(function (x) { return x && x.image_url; });

    let featured = '';
    if (post.featured_image_url && post.featured_image_url.startsWith('/assets/img/')) {
      featured = post.featured_image_url;
    } else if (featuredRow && featuredRow.image_url && featuredRow.image_url.startsWith('/assets/img/')) {
      featured = featuredRow.image_url;
    } else if (post.featured_image_url && !post.featured_image_url.includes('hostingersite.com')) {
      featured = post.featured_image_url;
    } else if (featuredRow && featuredRow.image_url && !featuredRow.image_url.includes('hostingersite.com')) {
      featured = featuredRow.image_url;
    } else {
      featured = localImageCandidates(slug, 1)[0];
    }

    const rawContent = replaceContentImages(post.content || '', gallery);
    const content = rewriteSameSiteArticleLinks(rawContent);

    document.title = (post.seo_title || post.title || 'Article') + ' | Mariage Madagascar';

    const metaDescription = document.querySelector('meta[name="description"]');
    if (metaDescription) {
      metaDescription.setAttribute(
        'content',
        post.seo_description || post.summary || ''
      );
    } else if (post.seo_description || post.summary) {
      const meta = document.createElement('meta');
      meta.name = 'description';
      meta.content = post.seo_description || post.summary || '';
      document.head.appendChild(meta);
    }

    let canonical = document.querySelector('link[rel="canonical"]');
    if (!canonical) {
      canonical = document.createElement('link');
      canonical.rel = 'canonical';
      document.head.appendChild(canonical);
    }
    canonical.href = location.origin + '/' + encodeURIComponent(slug);

    root.innerHTML =
      '<div class="relative h-72 md:h-[460px] bg-[#111828]">' +
        (featured
          ? '<img src="' + esc(featured) + '" alt="' + esc(post.title) + '" class="w-full h-full object-cover">'
          : '') +
        '<div class="absolute inset-0 bg-gradient-to-t from-[#0a0e1a] via-transparent to-transparent"></div>' +
      '</div>' +
      '<div class="p-8 md:p-12">' +
        '<div class="text-[#7dd3fc] text-xs uppercase tracking-widest mb-4">' +
          (post.published_at
            ? new Intl.DateTimeFormat('fr-FR', {
                day: '2-digit',
                month: 'long',
                year: 'numeric'
              }).format(new Date(post.published_at))
            : '') +
        '</div>' +
        '<h1 class="text-3xl md:text-5xl font-semibold mb-8">' +
          esc(post.title) +
        '</h1>' +
        '<div class="prose-blog">' + content + '</div>' +
      '</div>';

    const hero = root.querySelector('img');
    if (hero && !featured) {
      const first = localImageCandidates(slug, 1);
      let i = 0;
      hero.onerror = function () {
        i++;
        if (i < first.length) hero.src = first[i];
        else hero.style.display = 'none';
      };
    }
  }

  main().catch(function (error) {
    console.error(error);
    root.innerHTML =
      '<div class="p-12 text-center text-[#a0b4c4]">Impossible de charger cet article.</div>';
  });
})();
</script></body></html>
