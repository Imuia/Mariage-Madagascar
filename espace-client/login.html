<!doctype html>
<html lang="fr" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e1a">
<title>Connexion Espace Client | Mariage Madagascar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "surface-tint": "#7dd3fc",
                    "inverse-on-surface": "#0a0e1a",
                    "inverse-surface": "#e0e8f0",
                    "primary-container": "#0e4d6e",
                    "on-background": "#e0e8f0",
                    "surface": "#0f1524",
                    "tertiary": "#c8a0f0",
                    "surface-dim": "#0f1524",
                    "surface-container-low": "#111828",
                    "on-surface-variant": "#a0b4c4",
                    "secondary": "#88b4cc",
                    "surface-variant": "#1a2438",
                    "on-surface": "#e0e8f0",
                    "outline": "#4a6070",
                    "background": "#0a0e1a",
                    "surface-container": "#141c2e",
                    "primary": "#7dd3fc",
                    "error": "#ff6b6b"
                },
                "fontFamily": {
                    "headline": ["Inter", "sans-serif"],
                    "body": ["Inter", "sans-serif"]
                }
            }
        }
    }
</script>
<style>
:root{--bg:#0a0e1a;--surface:#0f1524;--panel:#111828;--line:#223247;--text:#e0e8f0;--muted:#9aafc1;--blue:#7dd3fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% 0%,rgba(125,211,252,.08),transparent 60%),var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}button,input{font:inherit}.material-symbols-outlined{font-size:20px;vertical-align:middle}

.glass-panel-elevated {
    background: rgba(15, 21, 36, 0.75);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(125, 211, 252, 0.15);
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(125, 211, 252, 0.05);
}

.glass-input {
    background: rgba(15, 21, 36, 0.5);
    border: 1px solid rgba(125, 211, 252, 0.15);
    transition: all 0.3s ease;
}

.glass-input:focus {
    border-color: rgba(125, 211, 252, 0.5);
    box-shadow: 0 0 15px rgba(125, 211, 252, 0.15);
    background: rgba(15, 21, 36, 0.8);
    outline: none;
}

.ambient-glow {
    position: fixed;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    width: 60vw;
    height: 60vw;
    max-width: 800px;
    max-height: 800px;
    background: radial-gradient(circle, rgba(125,211,252,0.04) 0%, rgba(10,14,26,0) 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
}
</style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col justify-between p-4 sm:p-6">

<div class="ambient-glow"></div>

<!-- Top Navigation Bar -->
<header class="w-full max-w-7xl mx-auto flex justify-between items-center py-2">
  <a href="/" class="flex items-center gap-3 group">
    <div class="p-1.5 rounded-xl border border-primary/20 group-hover:border-primary/50 transition-all flex items-center justify-center">
      <img style="max-width: 130px; height: auto;" src="/assets/logo/logo-mariage-madagascar.2.png" alt="Logo Mariage Madagascar" class="h-8 w-auto object-contain">
    </div>
  </a>
  <a href="/" class="text-xs text-on-surface-variant hover:text-primary transition-colors flex items-center gap-1.5 font-medium px-3 py-1.5 rounded-lg border border-outline-variant/40 hover:border-primary/30">
    <span class="material-symbols-outlined text-base">arrow_back</span>
    <span>Retour au site principal</span>
  </a>
</header>

<!-- Main Login Form Container -->
<main class="w-full max-w-md mx-auto my-auto py-8">
  <div class="glass-panel-elevated rounded-3xl p-8 sm:p-10 flex flex-col gap-6 relative overflow-hidden">

    <!-- Branding Header -->
    <div class="text-center">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primary/10 border border-primary/20 text-primary mb-4 shadow-[0_0_20px_rgba(125,211,252,0.15)]">
        <span class="material-symbols-outlined text-3xl">lock</span>
      </div>
      <p class="text-xs font-bold text-primary uppercase tracking-widest mb-1">ESPACE PRIVÉ CLIENT</p>
      <h1 class="font-headline text-2xl sm:text-3xl font-bold tracking-tight text-on-surface">Connexion</h1>
      <p class="text-on-surface-variant text-xs sm:text-sm mt-2">Accédez au suivi de vos préparatifs, contrats et échéances.</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="flex flex-col gap-4 mt-2" onsubmit="handleLogin(event)">

      <!-- Email Input -->
      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-xs font-semibold text-on-surface-variant">Adresse Email</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">mail</span>
          <input type="email" id="email" name="email" required placeholder="nom@exemple.com" class="w-full glass-input text-on-surface placeholder:text-on-surface-variant/40 text-sm rounded-xl py-3 pl-11 pr-4">
        </div>
      </div>

      <!-- Password Input -->
      <div class="flex flex-col gap-1.5">
        <div class="flex justify-between items-center">
          <label for="password" class="text-xs font-semibold text-on-surface-variant">Mot de Passe</label>
          <a href="#" class="text-xs text-primary hover:underline font-medium" onclick="handleResetPassword(); return false;">Mot de passe oublié ?</a>
        </div>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">key</span>
          <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full glass-input text-on-surface placeholder:text-on-surface-variant/40 text-sm rounded-xl py-3 pl-11 pr-11">
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
            <span class="material-symbols-outlined text-lg" id="eyeIcon">visibility</span>
          </button>
        </div>
      </div>

      <!-- Remember Me -->
      <div class="flex items-center gap-2 mt-1">
        <input type="checkbox" id="remember" name="remember" class="rounded bg-surface border-outline-variant text-primary focus:ring-primary/50">
        <label for="remember" class="text-xs text-on-surface-variant cursor-pointer">Se souvenir de moi sur cet appareil</label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="w-full bg-primary text-on-primary font-bold py-3.5 px-6 rounded-xl hover:bg-primary/90 transition-all flex items-center justify-center gap-2 text-sm shadow-[0_0_20px_rgba(125,211,252,0.25)] active:scale-95 mt-2">
        <span class="material-symbols-outlined text-lg">login</span>
        <span>Se connecter</span>
      </button>

    </form>

    <!-- Help Note -->
    <div class="pt-4 border-t border-primary/10 text-center">
      <p class="text-xs text-on-surface-variant">
        Pas encore d'accès client ? <a href="/#contact" class="text-primary hover:underline font-medium">Contactez notre équipe</a>
      </p>
    </div>

  </div>
</main>

<!-- Footer Note -->
<footer class="w-full text-center py-4">
  <p class="text-xs text-on-surface-variant/60">© 2026 Mariage Madagascar · Connexion sécurisée SSL 256-bit</p>
</footer>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="/assets/js/client-auth.js"></script>
<script>
function togglePasswordVisibility() {
  const pwdInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');
  if (pwdInput.type === 'password') {
    pwdInput.type = 'text';
    eyeIcon.textContent = 'visibility_off';
  } else {
    pwdInput.type = 'password';
    eyeIcon.textContent = 'visibility';
  }
}

async function handleLogin(event) {
  event.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const submitBtn = event.target.querySelector('button[type="submit"]');

  if (!email || !password) return;

  submitBtn.disabled = true;
  submitBtn.style.opacity = '0.7';

  try {
    const { data, error } = await window.clientSupabase.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      alert('Erreur de connexion : ' + (error.message || 'Identifiants invalides'));
      submitBtn.disabled = false;
      submitBtn.style.opacity = '1';
      return;
    }

    window.location.href = '/espace-client/index.html';
  } catch (err) {
    alert('Une erreur inattendue est survenue.');
    submitBtn.disabled = false;
    submitBtn.style.opacity = '1';
  }
}

async function handleResetPassword() {
  const email = prompt("Veuillez saisir votre adresse email pour recevoir un lien de réinitialisation :");
  if (!email) return;

  const { error } = await window.clientSupabase.auth.resetPasswordForEmail(email.trim(), {
    redirectTo: window.location.origin + '/espace-client/login.html'
  });

  if (error) {
    alert("Erreur : " + error.message);
  } else {
    alert("Un e-mail de réinitialisation de mot de passe vous a été envoyé.");
  }
}
</script>
</body>
</html>
