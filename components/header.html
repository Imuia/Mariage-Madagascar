<script>
(function () {
  'use strict';

  function normalizePath(value) {
    try {
      var path = new URL(value, window.location.origin).pathname.toLowerCase();
      path = path.replace(/\/index\.html$/i, '');
      if (path.length > 1) path = path.replace(/\/+$/, '');
      return path || '/';
    } catch (error) {
      return '/';
    }
  }

  function applyActiveMenu() {
    var nav = document.querySelector('nav.fixed.top-0.left-0.w-full.z-50');
    if (!nav) return;
    var current = normalizePath(window.location.pathname);
    var sections = [
      { href: '/nos-lieux-mariage-madagascar.html', paths: [
        '/nos-lieux-mariage-madagascar.html', '/destinations.html',
        '/nosy-be.html', '/morondava.html', '/tulear.html',
        '/diego-suarez.html', '/antananarivo.html', '/nosy-saba.html',
        '/sainte-marie.html'
      ]},
      { href: '/mariage.html', paths: ['/mariage.html'] },
      { href: '/services.html', paths: ['/services.html'] },
      { href: '/blog-wedding-planner-nosy-be.html', paths: [
        '/blog-wedding-planner-nosy-be.html', '/inspirations.html'
      ]},
      { href: '/lune-de-miel.html', paths: [
        '/lune-de-miel.html', '/lunes-de-miel.html', '/lune-de-miel-sainte-marie.html'
      ]}
    ];
    var section = sections.find(function (item) {
      return item.paths.some(function (path) { return normalizePath(path) === current; });
    });

    nav.querySelectorAll('.mm-nav-link').forEach(function (link) {
      var href = normalizePath(link.getAttribute('href') || '');
      var active = section ? href === normalizePath(section.href) : href === current;
      link.classList.toggle('is-active', active);
      if (active) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });
  }

  applyActiveMenu();
  window.addEventListener('pageshow', applyActiveMenu);
  window.addEventListener('popstate', applyActiveMenu);

  // Affiche « Mon compte » uniquement lorsqu'une session Supabase existe.
  function updateAccountLinks(isSignedIn) {
    document.querySelectorAll('[data-mm-account-link]').forEach(function (link) {
      link.href = isSignedIn ? '/espace-client/index.html' : '/espace-client/login.html';
      link.setAttribute('aria-label', isSignedIn ? 'Accéder à mon compte client' : 'Se connecter ou créer un compte client');
      var label = link.querySelector('[data-mm-account-label]');
      var icon = link.querySelector('[data-mm-account-icon]');
      if (label) label.textContent = isSignedIn ? 'Mon compte' : 'Se connecter / S’inscrire';
      if (icon) icon.textContent = isSignedIn ? 'account_circle' : 'login';
    });
  }

  function loadScriptOnce(src, globalReady) {
    if (globalReady()) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var script = document.querySelector('script[data-mm-header-script="' + src + '"]');
      if (script) {
        script.addEventListener('load', resolve, { once: true });
        script.addEventListener('error', reject, { once: true });
        return;
      }
      script = document.createElement('script');
      script.src = src;
      script.async = true;
      script.setAttribute('data-mm-header-script', src);
      script.onload = resolve;
      script.onerror = function () { reject(new Error('Impossible de charger ' + src)); };
      document.head.appendChild(script);
    });
  }

  async function initAccountLinks() {
    try {
      // 1. Charger le SDK avant la configuration publique.
      await loadScriptOnce('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', function () {
        return !!(window.supabase && typeof window.supabase.createClient === 'function');
      });

      // 2. Charger explicitement la configuration : le client partagé en dépend.
      await loadScriptOnce('/assets/js/supabase-config.js', function () {
        return !!(window.MARIAGE_SUPABASE && window.MARIAGE_SUPABASE.url && window.MARIAGE_SUPABASE.anonKey && window.mmSupabase);
      });

      // 3. Conserver le client commun utilisé par les autres pages du site.
      await loadScriptOnce('/assets/js/supabase-client.js', function () {
        return !!(window.mmSupabase && window.mmSupabase.auth);
      });

      var client = window.mmSupabase || window.supabaseClient;
      if (!client || !client.auth) {
        throw new Error(window.mmSupabaseError || 'Client Supabase indisponible.');
      }

      var result = await client.auth.getSession();
      if (result.error) throw result.error;

      updateAccountLinks(!!(result.data && result.data.session && result.data.session.user));

      // Mettre à jour les deux liens (desktop et mobile) à chaque changement de session.
      client.auth.onAuthStateChange(function (_event, session) {
        updateAccountLinks(!!(session && session.user));
      });
    } catch (error) {
      console.warn('[Mariage Madagascar] État du lien espace client indisponible :', error);
      // En cas d'erreur technique, conserver le lien de connexion par défaut.
      // Ne pas déconnecter l'utilisateur ni effacer sa session.
    }
  }

  initAccountLinks();
})();
</script>
