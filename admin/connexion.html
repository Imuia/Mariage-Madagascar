<!DOCTYPE html>
<html lang="fr" class="dark" data-admin-page="connexion.html">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Connexion Administration — Mariage Madagascar</title>
<meta name="robots" content="noindex,nofollow"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          surface: "#0f1524",
          "surface-container": "#141c2e",
          "surface-container-high": "#1a2438",
          primary: "#7dd3fc",
          "on-surface": "#e0e8f0",
          "on-surface-variant": "#a0b4c4",
          error: "#ff6b6b",
          background: "#0a0e1a"
        },
        fontFamily: {
          headline: ["Inter", "sans-serif"],
          body: ["Inter", "sans-serif"]
        }
      }
    }
  }
</script>
<style>
  body {
    background-color: #0a0e1a;
    color: #e0e8f0;
    font-family: 'Inter', sans-serif;
  }
  .glass-card {
    background: rgba(15, 21, 36, 0.75);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(125, 211, 252, 0.15);
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(125, 211, 252, 0.05);
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-background">
<!-- Ambient Light -->
<div class="fixed top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary/5 blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-[-20%] right-[-10%] w-[40%] h-[40%] rounded-full bg-purple-500/5 blur-[100px] pointer-events-none"></div>

<div class="w-full max-w-md glass-card rounded-2xl p-8 relative z-10 space-y-6">
  <!-- Brand Header -->
  <div class="text-center space-y-3">
    <div class="inline-flex p-3 rounded-2xl bg-surface-container border border-primary/20 shadow-[0_0_20px_rgba(125,211,252,0.1)] mb-2">
      <img src="/assets/logo/logo-mariage-madagascar.2.png"
           alt="Logo Mariage Madagascar"
           class="h-12 w-auto object-contain" />
    </div>
    <h1 class="text-2xl font-headline font-bold text-on-surface tracking-tight">Administration Mariage Madagascar</h1>
    <p class="text-xs text-on-surface-variant">Espace réservé aux administrateurs de la plateforme.</p>
  </div>

  <!-- Error & Status Alerts -->
  <div id="auth-alert" class="hidden p-3.5 rounded-xl border text-xs leading-relaxed" role="alert"></div>

  <!-- Login Form -->
  <form id="login-form" class="space-y-4">
    <div>
      <label for="email" class="block text-xs font-medium text-on-surface-variant uppercase tracking-wider mb-1.5">Adresse E-mail</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">mail</span>
        <input id="email"
               type="email"
               required
               autocomplete="email"
               placeholder="admin@mariage-madagascar.com"
               class="w-full pl-10 pr-4 py-2.5 bg-surface-container/60 border border-primary/10 rounded-xl text-sm text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all"/>
      </div>
    </div>

    <div>
      <div class="flex justify-between items-center mb-1.5">
        <label for="password" class="block text-xs font-medium text-on-surface-variant uppercase tracking-wider">Mot de passe</label>
        <button type="button" id="btn-forgot-password" class="text-xs text-primary hover:underline font-medium">Mot de passe oublié ?</button>
      </div>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">lock</span>
        <input id="password"
               type="password"
               required
               autocomplete="current-password"
               placeholder="••••••••••••"
               class="w-full pl-10 pr-10 py-2.5 bg-surface-container/60 border border-primary/10 rounded-xl text-sm text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all"/>
        <button type="button" id="toggle-password-btn" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors p-1" aria-label="Afficher/masquer le mot de passe">
          <span class="material-symbols-outlined text-lg" id="toggle-password-icon">visibility</span>
        </button>
      </div>
    </div>

    <button id="btn-submit"
            type="submit"
            class="w-full py-3 px-4 rounded-xl bg-primary text-background font-bold text-sm hover:bg-sky-300 active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(125,211,252,0.2)]">
      <span class="material-symbols-outlined text-lg">login</span>
      <span id="btn-text">Se connecter</span>
    </button>
  </form>

  <div class="pt-4 border-t border-primary/10 text-center">
    <p class="text-[11px] text-on-surface-variant/70">
      Accès sécurisé par Supabase Auth & RLS · Mariage Madagascar © 2026
    </p>
  </div>
</div>

<script src="admin-auth.js"></script>
<script>
  (function() {
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password-btn');
    const togglePasswordIcon = document.getElementById('toggle-password-icon');
    const btnSubmit = document.getElementById('btn-submit');
    const btnText = document.getElementById('btn-text');
    const btnForgotPassword = document.getElementById('btn-forgot-password');
    const alertBox = document.getElementById('auth-alert');

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = `p-3.5 rounded-xl border text-xs leading-relaxed ${
        isError
          ? 'bg-error/10 border-error/30 text-error'
          : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300'
      }`;
    }

    function hideAlert() {
      alertBox.className = 'hidden';
      alertBox.textContent = '';
    }

    // Toggle Password Visibility
    togglePasswordBtn.addEventListener('click', () => {
      const isPass = passwordInput.type === 'password';
      passwordInput.type = isPass ? 'text' : 'password';
      togglePasswordIcon.textContent = isPass ? 'visibility_off' : 'visibility';
    });

    // Handle Form Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showAlert('Veuillez remplir tous les champs.');
        return;
      }

      btnSubmit.disabled = true;
      btnText.textContent = 'Connexion en cours...';

      try {
        await window.MMAdminAuth.signIn(email, password);
        showAlert('Connexion réussie. Redirection...', false);

        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect') || 'index.html';
        setTimeout(() => {
          window.location.href = redirectParam;
        }, 600);
      } catch (err) {
        console.error('Login error:', err);
        showAlert(err.message || 'Identifiants incorrects ou compte non autorisé.');
        btnSubmit.disabled = false;
        btnText.textContent = 'Se connecter';
      }
    });

    // Handle Forgot Password
    btnForgotPassword.addEventListener('click', async () => {
      hideAlert();
      const email = emailInput.value.trim();

      if (!email) {
        showAlert('Veuillez d’abord saisir votre adresse e-mail dans le champ ci-dessus.');
        emailInput.focus();
        return;
      }

      try {
        btnForgotPassword.disabled = true;
        btnForgotPassword.textContent = 'Envoi...';
        await window.MMAdminAuth.resetPasswordForEmail(email);
        showAlert('Si un compte administrateur est associé à cette adresse, un lien de réinitialisation vous a été envoyé par e-mail.', false);
      } catch (err) {
        console.error('Password reset error:', err);
        showAlert(err.message || 'Impossible d’envoyer le lien de réinitialisation.');
      } finally {
        btnForgotPassword.disabled = false;
        btnForgotPassword.textContent = 'Mot de passe oublié ?';
      }
    });
  })();
</script>
</body>
</html>
