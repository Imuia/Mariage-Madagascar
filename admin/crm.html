<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0e1a;
            color: #e0e8f0;
        }
        
        /* Glassmorphism ambient background glow */
        .ambient-glow {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 70vw;
            height: 70vh;
            background: radial-gradient(circle, rgba(125,211,252,0.03) 0%, rgba(10,14,26,0) 70%);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }

        .ambient-glow-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(200,160,240,0.02) 0%, rgba(10,14,26,0) 70%);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }

        /* Custom scrollbar for Kanban board to match "Frozen Light" theme */
        ::-webkit-scrollbar {
            width: 6px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 21, 36, 0.4); 
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(125, 211, 252, 0.15); 
            border-radius: 8px;
            border: 1px solid rgba(125, 211, 252, 0.05);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(125, 211, 252, 0.3); 
        }

        /* Kanban Column Hide Scrollbar */
        .hide-scroll::-webkit-scrollbar {
            display: none;
        }
        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<link href="admin-shared.css" rel="stylesheet"/>

<!-- Supabase SDK & Auth Guard -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js"></script>
<script src="admin-auth.js"></script>

</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex selection:bg-primary/30 selection:text-primary relative overflow-x-hidden">
<div class="ambient-glow"></div>
<div class="ambient-glow-2"></div>

<!-- Main Content Area: CRM Pipeline -->
<main class="mm-main p-6 lg:p-8 w-full flex flex-col gap-6 min-h-screen">
<!-- Page Header & Filters -->
<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shrink-0">
<div>
<div class="flex items-center gap-3">
<button class="mm-mobile-burger md:hidden" data-mm-burger="" aria-label="Ouvrir le menu">
<span class="material-symbols-outlined">menu</span>
</button>
<h2 class="text-2xl font-headline font-semibold text-on-surface tracking-tight flex items-center gap-2">
                    Pipeline commercial
                    <span id="crm-total-leads-badge" class="bg-primary/10 text-primary text-xs font-medium px-2 py-0.5 rounded-full border border-primary/20 shadow-[0_0_10px_rgba(125,211,252,0.1)]">0 Leads</span>
</h2>
</div>
<p class="text-sm text-on-surface-variant mt-1 font-body">Gérez les demandes, prospects et opportunités de mariage.</p>
</div>
<div class="flex flex-wrap items-center gap-3">
<!-- Search input kept inside content -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm group-focus-within:text-primary transition-colors">search</span>
<input class="bg-surface/40 backdrop-blur-md border border-primary/10 rounded-lg py-2 pl-9 pr-4 text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary/50 focus:ring-1 focus:ring-primary/50 outline-none transition-all font-body text-body-sm shadow-[0_2px_10px_rgba(0,0,0,0.1)]" placeholder="Rechercher..." type="text"/>
</div>
<!-- Filters -->
<div class="relative group">
<select class="appearance-none bg-surface/40 backdrop-blur-md border border-primary/10 text-on-surface-variant rounded-lg pl-4 pr-10 py-2 text-sm focus:border-primary/50 focus:ring-1 focus:ring-primary/50 outline-none transition-all cursor-pointer hover:bg-surface/60 shadow-[0_2px_10px_rgba(0,0,0,0.1)] font-body">
<option value="all">Tous les statuts</option>
<option value="hot">Chaud</option>
<option value="warm">Tiède</option>
<option value="cold">Froid</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-sm group-hover:text-primary transition-colors">filter_list</span>
</div>
<div class="relative group">
<select class="appearance-none bg-surface/40 backdrop-blur-md border border-primary/10 text-on-surface-variant rounded-lg pl-4 pr-10 py-2 text-sm focus:border-primary/50 focus:ring-1 focus:ring-primary/50 outline-none transition-all cursor-pointer hover:bg-surface/60 shadow-[0_2px_10px_rgba(0,0,0,0.1)] font-body">
<option value="all">Tous les Planners</option>
<option value="1">Sophie L.</option>
<option value="2">Marc D.</option>
<option value="3">Elena R.</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-sm group-hover:text-primary transition-colors">person_search</span>
</div>
<!-- Action Button -->
<button class="bg-primary/15 text-primary border border-primary/30 hover:bg-primary/25 hover:border-primary/50 hover:shadow-[0_0_20px_rgba(125,211,252,0.2)] rounded-lg px-4 py-2 text-sm font-medium transition-all flex items-center gap-2 backdrop-blur-sm shadow-[0_4px_15px_rgba(0,0,0,0.2)]" data-demo-action="">
<span class="material-symbols-outlined text-[18px]">add</span>
                    Nouveau Lead
                </button>
</div>
</div>
<!-- Kanban Board Container -->
<div id="crm-kanban-board" class="flex-1 flex overflow-x-auto pb-4 gap-6 items-start min-h-[500px]">
  <!-- Dynamic content rendered by admin-crm.js -->
  <div class="flex items-center justify-center w-full py-12 text-on-surface-variant text-sm">
    Chargement du pipeline commercial...
  </div>
</div>
</main>

<div aria-live="polite" class="mm-toast" id="mm-toast" role="status"></div>
<script src="admin-shared.js"></script>
<script src="admin-crm.js"></script>
</body>
</html>
