<!DOCTYPE html>
<html lang="fr" class="dark" data-admin-page="reinitialisation.html">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Réinitialisation du mot de passe — Mariage Madagascar Admin</title>
<meta name="robots" content="noindex,nofollow"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          surface: "#0f1524",
          "surface-container": "#141c2e",
          "surface-container-high": "#1a2438",
          primary: "#7dd3fc",
          "on-surface": "#e0e8f0",
          "on-surface-variant": "#a0b4c4",
          error: "#ff6b6b",
          background: "#0a0e1a"
        },
        fontFamily: {
          headline: ["Inter", "sans-serif"],
          body: ["Inter", "sans-serif"]
        }
      }
    }
  }
</script>
<style>
  body {
    background-color: #0a0e1a;
    color: #e0e8f0;
    font-family: 'Inter', sans-serif;
  }
  .glass-card {
    background: rgba(15, 21, 36, 0.75);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(125, 211, 252, 0.15);
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(125, 211, 252, 0.05);
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-background">
<!-- Ambient Light -->
<div class="fixed top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary/5 blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-[-20%] right-[-10%] w-[40%] h-[40%] rounded-full bg-purple-500/5 blur-[100px] pointer-events-none"></div>

<div class="w-full max-w-md glass-card rounded-2xl p-8 relative z-10 space-y-6">
  <!-- Brand Header -->
  <div class="text-center space-y-3">
    <div class="inline-flex p-3 rounded-2xl bg-surface-container border border-primary/20 shadow-[0_0_20px_rgba(125,211,252,0.1)] mb-2">
      <img src="/assets/logo/logo-mariage-madagascar.2.png"
           alt="Logo Mariage Madagascar"
           class="h-12 w-auto object-contain" />
    </div>
    <h1 class="text-2xl font-headline font-bold text-on-surface tracking-tight">Réinitialisation du mot de passe</h1>
    <p class="text-xs text-on-surface-variant">Saisissez votre nouveau mot de passe administrateur.</p>
  </div>

  <!-- Error & Status Alerts -->
  <div id="auth-alert" class="hidden p-3.5 rounded-xl border text-xs leading-relaxed" role="alert"></div>

  <!-- Password Reset Form -->
  <form id="reset-form" class="space-y-4">
    <div>
      <label for="new-password" class="block text-xs font-medium text-on-surface-variant uppercase tracking-wider mb-1.5">Nouveau mot de passe</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">lock</span>
        <input id="new-password"
               type="password"
               required
               minlength="8"
               placeholder="••••••••••••"
               class="w-full pl-10 pr-4 py-2.5 bg-surface-container/60 border border-primary/10 rounded-xl text-sm text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all"/>
      </div>
    </div>

    <div>
      <label for="confirm-password" class="block text-xs font-medium text-on-surface-variant uppercase tracking-wider mb-1.5">Confirmer le mot de passe</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">lock_reset</span>
        <input id="confirm-password"
               type="password"
               required
               minlength="8"
               placeholder="••••••••••••"
               class="w-full pl-10 pr-4 py-2.5 bg-surface-container/60 border border-primary/10 rounded-xl text-sm text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all"/>
      </div>
    </div>

    <button id="btn-submit"
            type="submit"
            class="w-full py-3 px-4 rounded-xl bg-primary text-background font-bold text-sm hover:bg-sky-300 active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(125,211,252,0.2)]">
      <span class="material-symbols-outlined text-lg">key</span>
      <span id="btn-text">Changer le mot de passe</span>
    </button>
  </form>

  <div class="pt-4 border-t border-primary/10 text-center">
    <a href="connexion.html" class="text-xs text-primary hover:underline font-medium flex items-center justify-center gap-1">
      <span class="material-symbols-outlined text-sm">arrow_back</span>
      <span>Retour à la connexion</span>
    </a>
  </div>
</div>

<script src="admin-auth.js"></script>
<script>
  (function() {
    const form = document.getElementById('reset-form');
    const newPassInput = document.getElementById('new-password');
    const confirmPassInput = document.getElementById('confirm-password');
    const btnSubmit = document.getElementById('btn-submit');
    const btnText = document.getElementById('btn-text');
    const alertBox = document.getElementById('auth-alert');

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = `p-3.5 rounded-xl border text-xs leading-relaxed ${
        isError
          ? 'bg-error/10 border-error/30 text-error'
          : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300'
      }`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPass = newPassInput.value;
      const confirmPass = confirmPassInput.value;

      if (newPass !== confirmPass) {
        showAlert('Les mots de passe ne correspondent pas.');
        return;
      }

      if (newPass.length < 8) {
        showAlert('Le mot de passe doit contenir au moins 8 caractères.');
        return;
      }

      btnSubmit.disabled = true;
      btnText.textContent = 'Mise à jour...';

      try {
        await window.MMAdminAuth.updatePassword(newPass);
        showAlert('Votre mot de passe a été réinitialisé avec succès. Redirection vers la connexion...', false);
        setTimeout(() => {
          window.location.href = 'connexion.html';
        }, 1500);
      } catch (err) {
        console.error('Password update error:', err);
        showAlert(err.message || 'Erreur lors de la mise à jour du mot de passe.');
        btnSubmit.disabled = false;
        btnText.textContent = 'Changer le mot de passe';
      }
    });
  })();
</script>
</body>
</html>
